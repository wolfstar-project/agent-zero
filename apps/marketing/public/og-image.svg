<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Agent Zero — the open-source autonomous engineer">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#8ee34a" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <radialGradient id="halo" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#8ee34a" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#8ee34a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a1410" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#halo)" />

  <defs>
    <mask id="cutlogo" maskUnits="userSpaceOnUse"
          x="58.88" y="48" width="84.48" height="128">
      <rect x="58.88" y="48" width="84.48" height="128" fill="#fff"/>
      <g fill="#000"><rect x="53.12" y="106.729" width="96" height="10.542" transform="rotate(-62 101.12 112)"/></g>
    </mask>
    <clipPath id="cliplogo"><path d="M79.258,101.12A21.862,21.862 0 0 1 122.982,101.12L122.982,122.88A21.862,21.862 0 0 1 79.258,122.88Z"/></clipPath>
  </defs>
  <g mask="url(#cutlogo)" fill="none" stroke-width="7.424">
    <path class="ink-s" d="M101.12,83.712A17.408,17.408 0 0 1 118.528,101.12L118.528,122.88A17.408,17.408 0 0 1 83.712,122.88L83.712,101.12A17.408,17.408 0 0 1 101.12,83.712Z" stroke="#f3f7f1" stroke-opacity=".3" stroke-dasharray="0 1.338 16.437 21.788 16.437 40.9 16.437 21.788 16.437 1.338"/>
    <path class="ink-s" d="M101.12,83.712A17.408,17.408 0 0 1 118.528,101.12L118.528,122.88A17.408,17.408 0 0 1 83.712,122.88L83.712,101.12A17.408,17.408 0 0 1 101.12,83.712Z" stroke="#f3f7f1" stroke-dasharray="0 20.45 16.437 21.788 16.437 2.676 16.437 21.788 16.437 20.45"/>
  </g>
  <g class="acc" clip-path="url(#cliplogo)" fill="#8ee34a"><rect x="53.12" y="108.956" width="96" height="6.088" transform="rotate(-62 101.12 112)"/></g>
  <text x="142" y="123" fill="#f3f7f1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Agent Zero</text>

  <text x="80" y="300" fill="#f3f7f1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="750">The autonomous engineer</text>
  <text x="80" y="378" fill="#f3f7f1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="750">that never merges a guess</text>

  <text x="80" y="452" fill="#9fb5a6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">Finds, fixes, and verifies problems in pull requests.</text>

  <text x="80" y="540" fill="#8ee34a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24">$ zero review --mode observe</text>
