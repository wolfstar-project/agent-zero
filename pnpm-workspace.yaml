packages:
  - apps/*
  - packages/*

# Drop-in `typescript` replacement whose checker runs on tsgo in-process.
# Must be an exact version: the fork only publishes prerelease versions, which
# caret ranges never match.
overrides:
  typescript: npm:typescript-native-bridge@6.0.3-bridge.12.tsgo.7.0.2
  # @redstardev/unplugin-version-injector pins an older @nuxt/schema than the nuxt@4.5.2 this repo
  # actually runs. Two @nuxt/schema instances means two nominally different `DefineNuxtConfig`
  # types, so `defineNuxtConfig(...)` type-checks as "not callable" wherever the older one wins
  # resolution.
  '@nuxt/schema': npm:@nuxt/schema@4.5.2

onlyBuiltDependencies:
  - esbuild
