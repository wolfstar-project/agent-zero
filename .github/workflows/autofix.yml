# needed to securely identify the workflow
name: autofix.ci

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code:
    name: 🤖 Autofix code
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json

      - uses: jdx/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          version: 1.38.0
          run-install: true

      - name: 🔠 Fix formatting
        run: aube run format

      # merge_group events have no pull_request payload, so the autofix action
      # would target the synthetic gh-readonly-queue/... ref. Keep merge-queue
      # runs check-only and only hand off fixes on pull_request events.
      - name: 🔍 Verify formatting (merge queue)
        if: github.event_name == 'merge_group'
        run: git diff --exit-code

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        if: github.event_name == 'pull_request'
